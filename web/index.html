      <h1>PEPhub</h1>
      <p>
        PEPhub is a database and web interface for biological sample metadata, organized as PEPs (Portable
        Encapsulated Projects). This interface requires JavaScript.
      </p>
      <p>
        If you are an automated client, use the REST API instead of this page. The API is served from a
        different hostname than this site: requests to <code>https://pephub.databio.org/api/...</code> do not
        reach it.
      </p>
      <ul>
        <li>API base URL: <a href="https://pephub-api.databio.org">https://pephub-api.databio.org</a></li>
        <li>OpenAPI spec: <a href="https://pephub-api.databio.org/openapi.json">https://pephub-api.databio.org/openapi.json</a></li>
        <li>Interactive docs: <a href="https://pephub-api.databio.org/api/v1/docs">https://pephub-api.databio.org/api/v1/docs</a></li>
        <li>Guidance for automated clients: <a href="/llms.txt">/llms.txt</a></li>
      </ul>
      <p>
        Namespace archives are listed at
        <code>https://pephub-api.databio.org/api/v1/namespaces/{namespace}/archive</code>. That endpoint is the
        only way to learn the current archive filename; the CDN that stores them does not support directory
        listing.
      </p>
    </noscript>
